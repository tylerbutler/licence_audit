[tools]
erlang = "29.1"
gleam = "1.19.2"
just = "1.59.0"
"github:erlang/rebar3" = { version = "3.28.0", bin = "rebar3" }
node = "26.13.0"
pnpm = "12.18.0"
"github:jtdowney/queso" = "0.3.0"
"github:EmbarkStudios/cargo-about" = "0.9.3"
"github:tylerbutler/trellis" = "1.2.2"

# SBOM validation/scoring tooling (installed from GitHub releases)
"github:CycloneDX/cyclonedx-cli" = "0.33.1"
"github:CycloneDX/sbom-utility" = "0.19.2"
"github:interlynk-io/sbomqs" = "2.1.3"
"github:sbom-tool/sbom-tools" = "0.3.0"
"github:tylerbutler/licence_audit" = "latest"

# cdxgen publishes ~10 separate binaries per release; pin to just the
# cdx-validate structural validator and expose it under that name.
[tools."github:cdxgen/cdxgen"]
version = "13.6.0"
bin = "cdx-validate"
platforms= { linux-x64 = { asset_pattern = "cdx-validate-linux-amd64" }, linux-arm64 = { asset_pattern = "cdx-validate-linux-arm64" }, macos-x64 = { asset_pattern = "cdx-validate-darwin-amd64" }, macos-arm64 = { asset_pattern = "cdx-validate-darwin-arm64" } }

[settings]
lockfile = true

[settings.erlang]
precompiled_os = "ubuntu-24.04"
