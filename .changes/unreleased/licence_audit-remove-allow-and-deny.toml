package = "licence_audit"
kind = "Removed"
body = "Remove `--allow` and `--deny` from licence reports and `check`. Put complete allow/deny lists in `[tools.licence_audit]` in TOML and select an alternate policy with `--config`; ad-hoc CLI policy widening is no longer supported. Reports can still run without policy, while licence enforcement requires a non-empty configured allow list."
