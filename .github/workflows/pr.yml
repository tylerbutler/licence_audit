name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref == 'release/pending' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.head_ref == 'release/pending' }}

permissions:
  contents: read

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    env:
      LICENCE_AUDIT_TOOLCHAIN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install just
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # ratchet:jdx/mise-action@v4
        with:
          install_args: just
          add_shims_to_path: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: just pr-title-check "$PR_TITLE"

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Check changelog
        id: changelog
        continue-on-error: true
        run: |
          just changelog-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Post changelog comment
        if: steps.changelog.outputs.has_entries == 'true' || steps.changelog.outputs.needs_entry == 'true' || steps.changelog.outputs.invalid_fragments != '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: ${{ steps.changelog.outputs.preview }}

      - name: Remove changelog comment
        if: steps.changelog.outputs.has_entries == 'false' && steps.changelog.outputs.needs_entry == 'false' && steps.changelog.outputs.invalid_fragments == '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          delete: true

      - name: Fail invalid changelog
        if: steps.changelog.outputs.ok != 'true'
        run: exit 1
