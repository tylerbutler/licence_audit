name: Trellis Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Enter a candidate cycle (rc), promote (none), or prepare stable (empty)"
        type: string
        default: ""
      version:
        description: "Target version before the prerelease suffix (for example, 1.0.0)"
        type: string
        default: ""

concurrency:
  group: trellis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache Hex licence metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: .hex-cache
          key: hex-licence-v4-${{ runner.os }}-${{ hashFiles('manifest.toml') }}
          restore-keys: |
            hex-licence-v4-${{ runner.os }}-

      - name: Create or update release PR
        id: prepare
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run release preparation on main." >&2
            exit 1
          fi
          args=(--base main --branch release/pending --github-output)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            shopt -s extglob
            INPUT_PRE="${INPUT_PRE##+([[:space:]])}"
            INPUT_PRE="${INPUT_PRE%%+([[:space:]])}"
            INPUT_VERSION="${INPUT_VERSION##+([[:space:]])}"
            INPUT_VERSION="${INPUT_VERSION%%+([[:space:]])}"
            args+=(--no-resume --no-auto-pre --no-skip-unchanged)
            if [[ -n "$INPUT_PRE" ]]; then
              args+=(--pre "$INPUT_PRE")
            fi
            if [[ -n "$INPUT_VERSION" ]]; then
              args+=(--set "licence_audit=$INPUT_VERSION")
            fi
          fi
          mise exec -- trellis release pr "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Refresh generated release files
        if: steps.prepare.outputs.outcome == 'prepared'
        run: |
          set -euo pipefail
          git fetch origin release/pending
          git switch -C release/pending origin/release/pending
          just sbom-generate notices
          if git diff --quiet -- dist/sbom.json THIRD_PARTY_NOTICES.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh release artifacts" -- dist/sbom.json THIRD_PARTY_NOTICES.txt
          git push origin HEAD:release/pending
