name: Trellis Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Prerelease label (rc), promotion (none), or empty for stable"
        type: string
        default: ""
      version:
        description: "Target version before the prerelease suffix (for example, 1.0.0)"
        type: string
        default: ""

concurrency:
  group: trellis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache Hex licence metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: .hex-cache
          key: hex-licence-v4-${{ runner.os }}-${{ hashFiles('manifest.toml') }}
          restore-keys: |
            hex-licence-v4-${{ runner.os }}-

      - name: Create or update release PR
        id: prepare
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_VERSION: ${{ inputs.version }}
        run: mise exec -- python3 -B scripts/release_pr.py

      - name: Refresh generated release files
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin release/pending >/dev/null; then
            exit 0
          fi
          git fetch origin release/pending
          git switch -C release/pending origin/release/pending
          just sbom-generate notices
          if git diff --quiet -- dist/sbom.json THIRD_PARTY_NOTICES.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh release artifacts" -- dist/sbom.json THIRD_PARTY_NOTICES.txt
          git push origin HEAD:release/pending
