name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to test
        required: false
        type: string
        default: ''
      skip_sbom_drift_check:
        description: Skip drift when rebuilding a tag made before hermetic SBOMs
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Checkout validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .validation

      - name: Check vendored sources
        run: just vendor-check vendor-test

      - name: Test release notice staging
        run: |
          mise trust .validation/.mise.toml
          python3 -B -m unittest discover -s .validation/test -p release_notices_test.py

      - name: Check formatting
        run: just format-check

      - name: Lint (glinter)
        run: just glint

      - name: Type check
        run: just check

      - name: Build (warnings as errors)
        run: just build-strict

      - name: Check bare escript with embedded notices
        run: |
          mise exec -- python3 -B .validation/scripts/release_notices.py embed licence_audit
          mise exec -- python3 -B .validation/scripts/release_notices.py check licence_audit
          ./licence_audit --help

      - name: Check vendored production boundary
        run: just test-vendor-production

      - name: Run tests
        run: just test

      - name: Test runtime startup
        run: just test-runtime-startup

      - name: Test native smoke harness
        run: |
          python3 -B -m unittest discover -s .validation/test -p native_release_smoke_test.py
          python3 -B -m unittest discover -s .validation/test -p publish_release_test.py

      - name: Test CLI output streams
        run: LICENCE_AUDIT_TEST_ROOT="$PWD" mise exec -- python3 -B .validation/test/cli_stream_test.py

      - name: Test Unicode cache paths
        run: mise exec -- bash .validation/test/env_cache_paths.sh

      - name: Smoke test built CLI
        run: ./licence_audit --help

      - name: Check generated docs are up to date
        run: just docs-check

      - name: Cache Hex licence metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: .hex-cache
          key: hex-licence-v3-${{ runner.os }}-${{ hashFiles('manifest.toml') }}
          restore-keys: |
            hex-licence-v3-${{ runner.os }}-

      - name: Check committed SBOM is up to date
        if: ${{ !inputs.skip_sbom_drift_check }}
        run: just sbom-drift-check

      - name: Validate SBOM (schema)
        run: just sbom-validate

  native-http:
    runs-on: ubuntu-latest
    name: Native HTTP
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Checkout validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .validation

      - name: Install Queso glibc packaging dependencies
        # Queso treats glibc as a cross target even on Linux glibc hosts.
        run: |
          set -euo pipefail
          python3 -m pip install --user 'ziglang==0.14.1'
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build native Linux executable
        run: mise exec -- queso build --target x86_64-linux-glibc

      - name: Test native HTTP without system Erlang
        run: |
          set -euo pipefail
          binaries=(build/queso/licence_audit-*-x86_64-linux-glibc)
          test "${#binaries[@]}" -eq 1
          just --justfile .validation/justfile smoke-native-http "$PWD/${binaries[0]}"
