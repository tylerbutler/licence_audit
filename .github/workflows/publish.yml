name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      validation_only:
        description: Build and test without creating or publishing a release
        type: boolean
        default: false
      source_ref:
        description: Optional source ref for validation-only runs
        type: string
        default: ''
      artifacts_run_id:
        description: Reuse staged archives from this run (validation-only)
        type: string
        default: ''

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    if: ${{ !inputs.artifacts_run_id && (!inputs.source_ref || inputs.validation_only) }}
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.source_ref || inputs.tag || github.ref_name }}
      skip_sbom_drift_check: ${{ github.event_name == 'workflow_dispatch' }}

  build-release-artifacts:
    needs: test
    runs-on: ubuntu-latest
    name: Build release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Checkout validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .validation

      - name: Install Queso packaging dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 musl-tools
          python3 -m pip install --user 'ziglang==0.14.1'
          cargo install --locked cargo-zigbuild --version 0.23.4
          rustup target add \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            x86_64-pc-windows-gnu \
            x86_64-unknown-linux-musl
          mise exec -- queso --version
          python3 -m ziglang version
          cargo-zigbuild --version

      - name: Build escript
        run: just build-strict

      - name: Embed required notices in bare escript
        run: |
          mise exec -- python3 -B .validation/scripts/release_notices.py embed licence_audit
          mise exec -- python3 -B .validation/scripts/release_notices.py check licence_audit
          ./licence_audit --help

      - name: Generate CycloneDX SBOM
        env:
          REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./licence_audit sbom --output="dist/licence_audit-${REF_NAME}.cdx.json"

      - name: Build Queso executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$PWD/build/release-cache"
          mkdir -p build/release-tmp
          export TMPDIR="$PWD/build/release-tmp"
          rustup component add rust-docs
          just build-queso 2>&1 | tee build/queso-build.log
          mise exec github:EmbarkStudios/cargo-about@0.9.2 -- python3 -B .validation/scripts/runtime_notices.py --build-log build/queso-build.log

      - name: Stage release artifacts
        env:
          REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist

          version="${REF_NAME#v}"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.txt dist/
          escript_stage="licence_audit-${REF_NAME}"
          mkdir -p "$escript_stage"
          cp licence_audit "$escript_stage/"
          cp -r slate_native "$escript_stage/"
          mise exec -- python3 -B .validation/scripts/release_notices.py stage "$escript_stage"
          [ -f README.md ] && cp README.md "$escript_stage/" || true
          tar -czf "dist/${escript_stage}.tar.gz" "$escript_stage"
          (cd "$escript_stage" && zip -qr "../dist/${escript_stage}.zip" .)
          mise exec -- python3 -B .validation/scripts/release_notices.py check "dist/${escript_stage}.tar.gz"
          mise exec -- python3 -B .validation/scripts/release_notices.py check "dist/${escript_stage}.zip"

          # Ship the bare escript alongside the archives so it can be attested
          # and downloaded directly.
          cp licence_audit dist/
          mise exec -- python3 -B .validation/scripts/release_notices.py check dist/licence_audit

          targets=(
            aarch64-linux-glibc
            aarch64-linux-musl
            # linux-static excluded: no NIF symbol exports (crypto/SSL)
            aarch64-macos
            x86_64-linux-glibc
            x86_64-linux-musl
            # linux-static excluded: no NIF symbol exports (crypto/SSL)
            x86_64-macos
            x86_64-windows
          )

          for target in "${targets[@]}"; do
            archive_stage="licence_audit-${REF_NAME}-${target}"
            mkdir -p "$archive_stage"

            source_path="build/queso/licence_audit-${version}-${target}"
            if [[ "$target" == *-windows ]]; then
              source_path="${source_path}.exe"
              test -f "$source_path"
              cp "$source_path" "$archive_stage/licence_audit.exe"
            else
              test -f "$source_path"
              cp "$source_path" "$archive_stage/licence_audit"
              chmod +x "$archive_stage/licence_audit"
            fi

            mise exec -- python3 -B .validation/scripts/release_notices.py stage "$archive_stage" --target "$target"
            [ -f README.md ] && cp README.md "$archive_stage/" || true

            if [[ "$target" == *-windows ]]; then
              (cd "$archive_stage" && zip -qr "../dist/${archive_stage}.zip" .)
              mise exec -- python3 -B .validation/scripts/release_notices.py check "dist/${archive_stage}.zip" --target "$target"
            else
              tar -czf "dist/${archive_stage}.tar.gz" "$archive_stage"
              mise exec -- python3 -B .validation/scripts/release_notices.py check "dist/${archive_stage}.tar.gz" --target "$target"
            fi
          done

          test -f "dist/licence_audit-${REF_NAME}.tar.gz"
          test -f "dist/licence_audit-${REF_NAME}.zip"
          test -f "dist/licence_audit-${REF_NAME}-x86_64-windows.zip"
          test -f "dist/licence_audit-${REF_NAME}-x86_64-linux-glibc.tar.gz"
          test ! -e "dist/licence_audit-${REF_NAME}-aarch64-windows.zip"
          test ! -e "dist/licence_audit-${REF_NAME}-x86_64-linux-static.tar.gz"
          test ! -e "dist/licence_audit-${REF_NAME}-aarch64-linux-static.tar.gz"

          (cd dist && sha256sum licence_audit LICENSE NOTICE THIRD_PARTY_NOTICES.txt *.tar.gz *.zip *.cdx.json > checksums.txt)
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: licence_audit-release
          path: dist/

  native-runtime:
    needs: build-release-artifacts
    if: ${{ always() && ((inputs.validation_only && inputs.artifacts_run_id) || needs.build-release-artifacts.result == 'success') }}
    name: Runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      SMOKE_FIREWALL_GROUP: licence-audit-smoke-${{ github.run_id }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-glibc
            runner: ubuntu-24.04
            extension: tar.gz
          - target: aarch64-linux-glibc
            runner: ubuntu-24.04-arm
            extension: tar.gz
          - target: x86_64-macos
            runner: macos-15-intel
            extension: tar.gz
          - target: aarch64-macos
            runner: macos-15
            extension: tar.gz
          - target: x86_64-windows
            runner: windows-2025
            extension: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download staged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: licence_audit-release
          path: dist
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Checkout validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .validation

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ratchet:actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Windows console test driver
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2

      - name: Test Windows program firewall isolation and failure cleanup
        if: runner.os == 'Windows'
        run: python .validation/test/windows_firewall_smoke.py

      - name: Test installed archive on its target host
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          python .validation/test/native_release_smoke.py \
            --archive "dist/licence_audit-${RELEASE_TAG}-${TARGET}.${EXTENSION}" \
            --target "$TARGET" --version "$RELEASE_TAG"

      - name: Remove smoke program firewall rules
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Get-NetFirewallRule -Group "$env:SMOKE_FIREWALL_GROUP" -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction Stop

  release:
    needs: [build-release-artifacts, native-runtime]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .validation

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: licence_audit-release
          path: dist

      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/licence_audit
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Attest SBOM for release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # ratchet:actions/attest@v4
        with:
          subject-path: |
            dist/licence_audit
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/licence_audit-${{ env.RELEASE_TAG }}.cdx.json

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build-release-artifacts.result }}
          RUNTIME_RESULT: ${{ needs.native-runtime.result }}
        run: |
          set -euo pipefail
          python3 .validation/scripts/publish_release.py \
            --tag "$REF_NAME" --repository "$REPO" \
            --template .validation/.github/release-install.md.tmpl \
            --build-result "$BUILD_RESULT" --runtime-result "$RUNTIME_RESULT"
